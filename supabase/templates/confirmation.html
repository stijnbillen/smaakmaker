<!doctype html>
<html lang="nl">
  <body style="margin:0;padding:24px;background:#fbf5ea;color:#2b1d14;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;">
    <h1 style="font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:0 0 16px;">Aanmelden bij Smaakmaker</h1>
    <p>Tik op de knop om meteen aan te melden:</p>
    <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;background:#a8321a;color:#fffaf0;border-radius:999px;text-decoration:none;font-weight:600;">Aanmelden</a></p>
    <p>Werkt de link niet, bijvoorbeeld in de geïnstalleerde app? Typ dan deze code over in het veld Code uit de e-mail:</p>
    <p style="font-size:32px;font-weight:600;letter-spacing:6px;margin:8px 0 24px;">{{ .Token }}</p>
    <p style="color:#6b5648;font-size:14px;">Heb je dit niet gevraagd? Dan mag je deze mail negeren.</p>
  </body>
</html>
